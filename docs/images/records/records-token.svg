<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">The token record for $100</title>
  <desc id="figDesc">Eleven bytes: kind 4 for a number, part 0, offset 12, line 1, the lexeme's address and length, and the value $0100 stored low byte first.</desc>
  <defs>
    <style>
    :root {
      --ink:    #111417;
      --ink-2:  #454b52;
      --dim:    #8797a5;
      --rule:   #c8ccd0;
      --fill:   #ffffff;
      --fill-2: #eef0f1;
      --sig:    #14607e;
      --sig-bg: #14607e1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:    #e6e8ea;
        --ink-2:  #b3b9bf;
        --dim:    #7d8890;
        --rule:   #3d4348;
        --fill:   #1c1f22;
        --fill-2: #262a2e;
        --sig:    #5fa8c6;
        --sig-bg: #5fa8c626;
      }
    }

    .bx    { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.5; }
    .bx2   { fill: var(--fill-2); stroke: var(--ink);  stroke-width: 1.5; }
    .bxq   { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.5; }
    .bxs   { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 2; }
    .sig   { fill: var(--sig);    stroke: var(--sig);  stroke-width: 1.5; }
    .none  { fill: none;          stroke: var(--ink);  stroke-width: 1.5; }
    .rule  { fill: none; stroke: var(--rule); stroke-width: 1; }
    .dash  { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }
    .sline { fill: none; stroke: var(--sig);  stroke-width: 2; }

    .t     { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .ts    { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
    .tb    { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
    .n     { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .ns    { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
    .nb    { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
    .dim   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
    .dimn  { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
    .cap   { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
             fill: var(--sig); letter-spacing: .12em; }
    .on-sig { fill: var(--sig); }
    .on-dim { fill: var(--dim); }
    .inv   { fill: var(--fill); }
  </style>
    <!-- markerUnits defaults to strokeWidth, which sizes every arrowhead by the
         weight of the line carrying it. A 2px signal arrow then gets a head a
         third larger than the 1.5px ink arrow beside it, and in a figure that
         uses both the heads read as mismatched rather than as emphasis. Fixed
         in user space so one arrowhead is one size everywhere. -->
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--sig)"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--dim)"/>
    </marker>
  </defs>
  <text class="cap" x="60" y="22" text-anchor="start" xml:space="preserve">TOKEN RECORD  $100  LINE 1</text>
  <rect class="bx" x="60" y="46" width="46" height="30" rx="2"/>
  <text class="t" x="83" y="65.5" text-anchor="middle" xml:space="preserve">04</text>
  <rect class="bx" x="106" y="46" width="46" height="30" rx="2"/>
  <text class="t" x="129" y="65.5" text-anchor="middle" xml:space="preserve">00</text>
  <rect class="bx" x="152" y="46" width="46" height="30" rx="2"/>
  <text class="t" x="175" y="65.5" text-anchor="middle" xml:space="preserve">0C</text>
  <rect class="bx" x="198" y="46" width="46" height="30" rx="2"/>
  <text class="t" x="221" y="65.5" text-anchor="middle" xml:space="preserve">00</text>
  <rect class="bx" x="244" y="46" width="46" height="30" rx="2"/>
  <text class="t" x="267" y="65.5" text-anchor="middle" xml:space="preserve">01</text>
  <rect class="bx" x="290" y="46" width="46" height="30" rx="2"/>
  <text class="t" x="313" y="65.5" text-anchor="middle" xml:space="preserve">00</text>
  <rect class="bx" x="336" y="46" width="46" height="30" rx="2"/>
  <text class="t" x="359" y="65.5" text-anchor="middle" xml:space="preserve">8F</text>
  <rect class="bx" x="382" y="46" width="46" height="30" rx="2"/>
  <text class="t" x="405" y="65.5" text-anchor="middle" xml:space="preserve">07</text>
  <rect class="bx" x="428" y="46" width="46" height="30" rx="2"/>
  <text class="t" x="451" y="65.5" text-anchor="middle" xml:space="preserve">04</text>
  <rect class="bxs" x="474" y="46" width="46" height="30" rx="2"/>
  <text class="tb" x="497" y="65.5" text-anchor="middle" xml:space="preserve">00</text>
  <rect class="bxs" x="520" y="46" width="46" height="30" rx="2"/>
  <text class="tb" x="543" y="65.5" text-anchor="middle" xml:space="preserve">01</text>
  <text class="dim" x="83" y="39" text-anchor="middle" xml:space="preserve">+0</text>
  <text class="dim" x="129" y="39" text-anchor="middle" xml:space="preserve">+1</text>
  <text class="dim" x="175" y="39" text-anchor="middle" xml:space="preserve">+2</text>
  <text class="dim" x="221" y="39" text-anchor="middle" xml:space="preserve">+3</text>
  <text class="dim" x="267" y="39" text-anchor="middle" xml:space="preserve">+4</text>
  <text class="dim" x="313" y="39" text-anchor="middle" xml:space="preserve">+5</text>
  <text class="dim" x="359" y="39" text-anchor="middle" xml:space="preserve">+6</text>
  <text class="dim" x="405" y="39" text-anchor="middle" xml:space="preserve">+7</text>
  <text class="dim" x="451" y="39" text-anchor="middle" xml:space="preserve">+8</text>
  <text class="dim" x="497" y="39" text-anchor="middle" xml:space="preserve">+9</text>
  <text class="dim" x="543" y="39" text-anchor="middle" xml:space="preserve">+10</text>
  <line class="rule" x1="64" y1="81" x2="102" y2="81"/>
  <text class="ns" x="83" y="96" text-anchor="middle" xml:space="preserve">kind</text>
  <line class="rule" x1="110" y1="81" x2="148" y2="81"/>
  <text class="ns" x="129" y="112" text-anchor="middle" xml:space="preserve">part</text>
  <line class="rule" x1="156" y1="81" x2="240" y2="81"/>
  <text class="ns" x="198" y="96" text-anchor="middle" xml:space="preserve">offset</text>
  <line class="rule" x1="248" y1="81" x2="332" y2="81"/>
  <text class="ns" x="290" y="112" text-anchor="middle" xml:space="preserve">line</text>
  <line class="rule" x1="340" y1="81" x2="424" y2="81"/>
  <text class="ns" x="382" y="96" text-anchor="middle" xml:space="preserve">lexeme</text>
  <line class="rule" x1="432" y1="81" x2="470" y2="81"/>
  <text class="ns" x="451" y="112" text-anchor="middle" xml:space="preserve">length</text>
  <line class="rule" x1="478" y1="81" x2="562" y2="81"/>
  <text class="nb" x="520" y="96" text-anchor="middle" xml:space="preserve">value</text>
</svg>
