name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atom-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run release:check
      - run: npm run verify:package-census
      - name: Prepare CP/M release files
        run: |
          npm run prepare:github-release -- \
            --tag "$GITHUB_REF_NAME" \
            --commit "$(git rev-parse HEAD)" \
            --output release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/ATOM.COM \
            release/ATOM.manifest.json \
            release/SHA256SUMS \
            --verify-tag \
            --title "Atom ${GITHUB_REF_NAME#v}" \
            --generate-notes
  pages:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: atom-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add release downloads to the Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run prepare:pages-releases
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the Atom download site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
