name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: atom-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - run: npm install
      - run: npm run release:check
      - run: npm run verify:package-census
      - name: Prepare CP/M release files
        run: |
          npm run prepare:github-release -- \
            --tag "$GITHUB_REF_NAME" \
            --commit "$(git rev-parse HEAD)" \
            --output release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/ATOM.COM \
            release/ATOM.manifest.json \
            release/SHA256SUMS \
            --verify-tag \
            --title "Atom ${GITHUB_REF_NAME#v}" \
            --generate-notes
